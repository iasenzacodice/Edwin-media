<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il salto dell'automa</title>
<style>body{margin:0;background:#1d2b3a;display:grid;place-items:center;height:100vh;font-family:Inter,sans-serif}canvas{width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth*2;H=c.height=innerHeight*2}rs();
const st={mode:'titolo',lv:2,score:0,coins:[],plats:[],p:{x:0,y:0,vy:0}};
function level(n){st.plats=[[0.05,0.82,0.3],[0.42,0.68,0.22],[0.7,0.55,0.2],[0.45,0.40,0.18],[0.12,0.30,0.2]];st.coins=st.plats.map(p=>[p[0]+p[2]/2,p[1]-0.06,1]);st.p={x:0.15,y:0.82,vy:0}}
level(1);
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d2b3a');g.addColorStop(1,'#2E4A62');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#ffffff99';for(let i=0;i<40;i++){x.beginPath();x.arc((i*97%100)/100*W,(i*53%60)/100*H,3,0,7);x.fill()}
x.fillStyle='#24384b';x.beginPath();x.moveTo(0,H);for(let i=0;i<=10;i++)x.lineTo(i/10*W,H*0.75+Math.sin(i*1.7)*H*0.06);x.lineTo(W,H);x.fill()}
function edwin(px,py,s){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle='#D9A04A';x.strokeStyle='#2A1E16';x.lineWidth=5;
x.fillRect(-30,-70,60,50);x.strokeRect(-30,-70,60,50);x.fillStyle='#3FE0D0';x.beginPath();x.arc(-12,-46,9,0,7);x.arc(12,-46,9,0,7);x.fill();
x.strokeStyle='#9C4A26';x.beginPath();x.moveTo(0,-70);x.lineTo(0,-88);x.stroke();x.fillStyle='#3FE0D0';x.beginPath();x.arc(0,-92,7,0,7);x.fill();
x.fillStyle='#5A341C';x.fillRect(-24,-20,48,24);x.restore()}
function draw(){bg();const u=Math.min(W,H)/560;
if(st.mode=='titolo'){x.fillStyle='#F7F0E0';x.textAlign='center';x.font=`700 ${70*u}px Lora`;x.fillText("Il salto",W/2,H*0.2);x.fillText("dell'automa",W/2,H*0.2+80*u);
edwin(W/2,H*0.48,2.4*u);
['Livello 1 · Il porto','Livello 2 · Le nuvole','Livello 3 · La luna'].forEach((t,i)=>{const y=H*0.6+i*95*u;x.fillStyle=i==0?'#E3B657':'#F7F0E0';x.beginPath();x.roundRect(W/2-230*u,y,460*u,74*u,37*u);x.fill();x.fillStyle='#2A1E16';x.font=`700 ${30*u}px Inter`;x.fillText(t+(i==2?'  🔒':''),W/2,y+48*u)});
x.fillStyle='#F7F0E0aa';x.font=`${24*u}px Inter`;x.fillText('Tocca lo schermo per saltare',W/2,H*0.93);return}
st.plats.forEach(p=>{x.fillStyle='#6E9E5A';x.fillRect(p[0]*W,p[1]*H,p[2]*W,26*u);x.fillStyle='#4f7a3f';x.fillRect(p[0]*W,p[1]*H+26*u,p[2]*W,14*u)});
st.coins.forEach(k=>{if(!k[2])return;x.fillStyle='#E3B657';x.strokeStyle='#8C5A20';x.lineWidth=5*u;x.beginPath();x.arc(k[0]*W,k[1]*H,18*u,0,7);x.fill();x.stroke()});
edwin(st.p.x*W,st.p.y*H,1.3*u);
x.fillStyle='#F7F0E0';x.textAlign='left';x.font=`700 ${34*u}px Inter`;x.fillText('★ '+st.score,30*u,60*u);x.textAlign='right';x.fillText('Livello '+st.lv+' · ❤❤❤',W-30*u,60*u)}
function step(){if(st.mode!='gioco')return;const p=st.p;p.vy+=0.0009;p.y+=p.vy;
st.plats.forEach(q=>{if(p.vy>0&&p.x>q[0]&&p.x<q[0]+q[2]&&Math.abs(p.y-q[1])<0.012){p.y=q[1];p.vy=0}});
st.coins.forEach(k=>{if(k[2]&&Math.abs(k[0]-p.x)<0.05&&Math.abs(k[1]-p.y+0.04)<0.05){k[2]=0;st.score+=10}});
if(p.y>1.1)level(st.lv);draw();requestAnimationFrame(step)}
c.onpointerdown=e=>{if(st.mode=='titolo'){st.mode='gioco';step();return}st.p.vy=-0.028;st.p.x=Math.min(0.95,Math.max(0.05,e.clientX*2/W))};
if(location.hash=='#gioco'){st.mode='gioco';st.lv=2;st.score=120;st.coins[0][2]=0;st.coins[1][2]=0;st.p={x:0.53,y:0.68,vy:0}}
draw();
</script></body></html>

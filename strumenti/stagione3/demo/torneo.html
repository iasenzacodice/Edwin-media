<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torneo di calcetto</title>
<style>:root{--a:#1F4E8C;--b:#F2C230}body{margin:0;font-family:Inter,sans-serif;color:#1d2433;background:#F5F7FA}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:var(--a);color:#fff}nav b{font-family:Lora,serif;font-size:24px}nav a{color:#fff;margin-left:24px;text-decoration:none;opacity:.8}nav a.on{opacity:1;border-bottom:3px solid var(--b);padding-bottom:4px}
.hero{background:linear-gradient(135deg,var(--a),#2a6bbf);color:#fff;padding:50px 40px;display:flex;gap:40px;align-items:center}.hero h1{font-family:Lora,serif;font-size:54px;margin:0 0 10px;line-height:1.05}.hero p{font-size:20px;opacity:.9}
.cta{display:inline-block;background:var(--b);color:#1d2433;font-weight:800;padding:14px 26px;border-radius:30px;font-size:18px;margin-top:10px}
.cnt{display:flex;gap:12px;margin-top:22px}.cnt div{background:#ffffff22;border-radius:14px;padding:10px 16px;text-align:center}.cnt b{display:block;font-size:30px}
.box{max-width:1100px;margin:30px auto;padding:0 40px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cd{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 0 #dfe5ee}.cd h3{margin:0 0 6px;color:var(--a)}
form{background:#fff;border-radius:20px;padding:26px;box-shadow:0 2px 0 #dfe5ee;max-width:620px}label{display:block;font-weight:700;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;font:17px Inter;padding:12px;border-radius:12px;border:2px solid #dfe5ee}
button{margin-top:18px;border:0;background:var(--a);color:#fff;font:800 18px Inter;padding:15px 28px;border-radius:30px}.ok{background:#E8F5EC;color:#1d6b3a;border-radius:14px;padding:14px;margin-top:14px;font-weight:700}
.rg li{margin:10px 0;font-size:18px}</style></head><body>
<nav><b>Torneo dei Bar · 2027</b><div><a href="#home">Home</a><a href="#regole">Regole</a><a href="#iscriviti">Iscriviti</a></div></nav><div id="v"></div>
<script>
const V={home:`<div class="hero"><div><h1>Torneo di calcetto<br>dei Bar del paese</h1><p>Sabato 15 maggio · Campo comunale · dalle 9:00</p><span class="cta">Iscrivi la tua squadra</span>
<div class="cnt"><div><b>12</b>squadre</div><div><b>6</b>posti liberi</div><div><b>18</b>giorni</div></div></div>
<svg width="300" height="220" viewBox="0 0 300 220"><rect x="10" y="20" width="280" height="180" rx="14" fill="#3E9B5B" stroke="#fff" stroke-width="5"/><line x1="150" y1="20" x2="150" y2="200" stroke="#fff" stroke-width="5"/><circle cx="150" cy="110" r="34" fill="none" stroke="#fff" stroke-width="5"/><circle cx="198" cy="84" r="14" fill="#fff" stroke="#1d2433" stroke-width="4"/></svg></div>
<div class="box cards"><div class="cd"><h3>Come funziona</h3>Gironi da 4 la mattina, eliminazione diretta il pomeriggio.</div><div class="cd"><h3>Quota</h3>60 € a squadra, tutto in beneficenza alla Pro Loco.</div><div class="cd"><h3>Premi</h3>Coppa, cena per la squadra vincitrice e foto ricordo.</div></div>`,
regole:`<div class="box"><h1 style="font-family:Lora">Regole del torneo</h1><ul class="rg"><li>Squadre da 5 giocatori più 2 riserve</li><li>Partite da 2 tempi di 12 minuti</li><li>Almeno un giocatore over 40 in campo</li><li>Arbitri: volontari della Pro Loco</li><li>In caso di pioggia si gioca lo stesso</li></ul></div>`,
iscriviti:`<div class="box"><h1 style="font-family:Lora">Iscrivi la squadra</h1><form onsubmit="event.preventDefault();this.querySelector('.ok').style.display='block'"><label>Nome della squadra</label><input value="Bar Centrale"><label>Capitano</label><input value="Paolo"><label>Numero di giocatori</label><select><option>7</option></select><button>Invia iscrizione</button><div class="ok" style="display:${location.hash=='#iscritto'?'block':'none'}">✓ Iscrizione ricevuta. Ti scriviamo entro 2 giorni.</div></form></div>`};
function go(){const h=(location.hash.slice(1)||'home').replace('iscritto','iscriviti');v.innerHTML=V[h];document.querySelectorAll('nav a').forEach(a=>a.className=a.getAttribute('href')=='#'+h?'on':'')}onhashchange=go;go();
</script></body></html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puglia in 5 giorni</title>
<style>
body{margin:0;font-family:Inter,sans-serif;background:#EDE6D6;color:#2A1E16;display:flex;height:100vh}
aside{width:360px;background:#FBF7EC;padding:26px;box-shadow:2px 0 0 #DCCFB3;overflow:auto}
h1{font-family:Lora,serif;font-size:30px;margin:0 0 4px}.sub{color:#7a6a58;margin-bottom:18px}
.g{display:flex;gap:12px;padding:12px;border-radius:14px;margin-bottom:8px;cursor:pointer}.g.on{background:#E9DFCB}
.n{width:34px;height:34px;border-radius:50%;background:#B3261E;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.g b{display:block}.g span{color:#7a6a58;font-size:14px}
main{flex:1;position:relative}svg{width:100%;height:100%}
.card{position:absolute;background:#fff;border-radius:16px;padding:14px 16px;width:250px;box-shadow:0 6px 20px #0002;font-size:14px}
.card h3{margin:0 0 6px;font-family:Lora,serif;font-size:20px}.card .t{color:#2f8a83;font-weight:700;margin-bottom:6px}
</style></head><body>
<aside><h1>Puglia in 5 giorni</h1><div class="sub">Giugno · in auto · 2 adulti</div><div id="list"></div></aside>
<main><svg viewBox="0 0 900 800" id="m">
<rect width="900" height="800" fill="#A9CFD0"/>
<path d="M60 40 L330 40 L420 150 L520 230 L640 320 L760 430 L850 560 L870 700 L820 760 L760 700 L700 600 L620 560 L560 470 L470 420 L380 400 L300 360 L230 300 L160 260 L90 230 L40 160 Z" fill="#F3EAD3" stroke="#8C7350" stroke-width="3"/>
<path d="M40 160 L0 200 L0 0 L60 40" fill="#E8DCBF"/>
<text x="560" y="140" font-family="Lora" font-style="italic" font-size="26" fill="#3d7f86" letter-spacing="6">MARE ADRIATICO</text>
<text x="300" y="640" font-family="Lora" font-style="italic" font-size="24" fill="#3d7f86" letter-spacing="6">MAR IONIO</text>
<path id="rt" d="" fill="none" stroke="#B3261E" stroke-width="5" stroke-dasharray="14 10"/>
<g id="pins"></g></svg><div class="card" id="card"></div></main>
<script>
const S=[["Matera","Sassi e belvedere",240,330,"Giorno 1","Dormire in una casa nei Sassi. Tramonto dal belvedere di Murgia Timone."],
["Alberobello","Trulli e Locorotondo",430,270,"Giorno 2","Arrivare presto per evitare la folla. Pranzo a Locorotondo."],
["Polignano","Mare e Monopoli",400,190,"Giorno 3","Bagno a Cala Porto la mattina, sera a Monopoli."],
["Lecce","Barocco e cena tipica",680,470,"Giorno 4","Centro a piedi. Provare il rustico leccese."],
["Otranto","Costa e Grotta Zinzulusa",800,560,"Giorno 5","Strada costiera fino a Santa Maria di Leuca."]];
let sel=+(location.hash.slice(1)||0);
function draw(){document.getElementById('rt').setAttribute('d','M'+S.map(s=>s[2]+' '+s[3]).join(' L'));
document.getElementById('pins').innerHTML=S.map((s,i)=>`<g transform="translate(${s[2]} ${s[3]})" onclick="sel=${i};draw()" style="cursor:pointer"><path d="M0 0 C-16 -22 -20 -32 -20 -40 A20 20 0 0 1 20 -40 C20 -32 16 -22 0 0Z" fill="${i==sel?'#B3261E':'#2f8a83'}" stroke="#2A1E16" stroke-width="3"/><text x="0" y="-33" text-anchor="middle" font-family="Inter" font-weight="700" font-size="17" fill="#fff">${i+1}</text><text x="26" y="-30" font-family="Lora" font-weight="700" font-size="22" fill="#2A1E16">${s[0]}</text></g>`).join('');
document.getElementById('list').innerHTML=S.map((s,i)=>`<div class="g ${i==sel?'on':''}" onclick="sel=${i};draw()"><div class="n">${i+1}</div><div><b>${s[4]} · ${s[0]}</b><span>${s[1]}</span></div></div>`).join('');
const c=document.getElementById('card'),s=S[sel],r=document.getElementById('m').getBoundingClientRect();
c.style.left=(s[2]/900*r.width+20)+'px';c.style.top=(s[3]/800*r.height+10)+'px';
c.innerHTML=`<div class="t">${s[4]}</div><h3>${s[0]}</h3>${s[5]}`}
draw();
</script></body></html>
